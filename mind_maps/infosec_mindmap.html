
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Security Course — Knowledge Graph</title>

<!-- ── 3rd‑party libs ­────────────────────────────────────────── -->
<link  href="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.2/dist/vis-network.min.css"
       rel="stylesheet" >
<script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.2/dist/vis-network.min.js"
        ></script>

<link  href="https://cdnjs.cloudflare.com/ajax/libs/tom-select/2.0.0-rc.4/css/tom-select.min.css"
       rel="stylesheet" >
<script src="https://cdnjs.cloudflare.com/ajax/libs/tom-select/2.0.0-rc.4/js/tom-select.complete.min.js"
        ></script>

<link  href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
       rel="stylesheet" >
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        ></script>

<!-- ── layout ─────────────────────────────────────────────────── -->
<style>
body              { background:#111;color:#ddd;font-family:system-ui }
#mynetwork        { width:100%;height:900px;border:1px solid #444;background:#1a1a1a }
#loadingBar       { position:absolute;top:0;left:0;width:100%;height:900px;
                    background:rgba(200,200,200,.85);display:flex;align-items:center;justify-content:center;
                    transition:opacity .5s }
#loadingBar.hidden{ opacity:0;pointer-events:none }
#barContainer     { width:500px;height:30px;border:2px solid #333;border-radius:15px;overflow:hidden }
#bar              { height:100%;width:0;background:#00adf6 }
#progressText     { margin-top:10px;text-align:center;font-size:20px;color:#000 }
</style>
</head>
<body>

<div class="card w-100 mb-3">
  <div class="card-header">
    <div class="row g-2">
      <div class="col-10">
        <select id="select-node" placeholder="Select node …"></select>
      </div>
      <div class="col-2">
        <button class="btn btn-primary w-100" onclick="neighbourhoodHighlight({nodes:[]})">Reset Selection</button>
      </div>
    </div>
  </div>
  <div id="mynetwork" class="card-body p-0"></div>
</div>

<div id="loadingBar">
  <div>
    <div id="barContainer"><div id="bar"></div></div>
    <div id="progressText">0 %</div>
  </div>
</div>

<div id="config"></div>

<script>
/* ── INPUT DATA ─────────────────────────────────────────────── */
/*  A nested object of Modules → Sections → Bullets.
 *  Feel free to extend or tweak; the graph is built programmatically. */
const syllabus = {
  "Module 1 – Program Security": {
    "Program Security & Malicious Code": [
      "Risk Management & Residual Risk",
      "Method‑Opportunity‑Motive (MOM)",
      "Vulnerabilities",
      "Controls"
    ],
    "Malicious Code Types": [
      "Virus (transient vs resident)",
      "Worm (network‑propagating)",
      "Trojan Horse"
    ],
    "Malware Lifecycle & Harm": [
      "Propagation & Activation",
      "Stealth Tactics",
      "Payload Categories"
    ],
    "Countermeasures & Developer Controls": [
      "Software Defenses",
      "Hardware Defenses",
      "Behavioral Defenses",
      "User Vigilance",
      "Virus Detectors",
      "Developer Controls"
    ]
  },

  "Module 2 – Authentication": {
    "Identification vs Authentication": [
      "Identification",
      "Authentication Factors"
    ],
    "Something You Know": [
      "Password Lifecycle",
      "Weaknesses",
      "Defenses",
      "Security Questions"
    ],
    "Something You Are": ["Biometrics – pros/cons"],
    "Something You Have": ["Tokens (static,dynamic,soft)"],
    "Location & Behavioral": ["Location Factors","Behavioral Factors"],
    "User Authentication Protocols": [
      "Kerberos","LDAP","OAuth 2.0","SAML","RADIUS"
    ],
    "Information Security Standards": [
      "ISO 27001/27002","NIST","GDPR","FINRA","HIPAA","PCI DSS"
    ],
    "Access Control Fundamentals": [
      "Reference Monitor","Directory/Matrix/ACL/Privilege List",
      "RBAC","ABAC","Attribute‑Based Encryption (ABE)"
    ],
    "Cryptography & Key Mgmt": [
      "Symmetric/Asymmetric","Key Lifecycle","Hybrid Encryption",
      "Key Exchange Protocols"
    ]
  },

  "Module 3 – OS Security": {
     "Security in Operating Systems":[
       "Protection Goals","Boot‑time Sequencing","Core Security Features"
     ],
     "Layered Design & TCB":[
       "Security Kernel","Trusted Computing Base","Secure Startup"
     ],
     "Virtualization & Sandboxing":[
       "Virtual Machines","Honeypots","Separation vs Sharing"
     ]
  },

  "Module 4 – Security Countermeasures": {
    "Firewalls":[
      "Packet Filter","Stateful Inspection","Proxy Firewall",
      "Circuit Gateway","Guard","Personal Firewall"
    ],
    "NAT / DLP / IDS‑IPS":[
      "Network Address Translation",
      "Data Loss Prevention",
      "Intrusion Detection / Prevention"
    ]
  },

  "Module 5 – Database Security": {
    "DB Fundamentals":[
      "Keys & Relationships","Integrity Requirements","Auditability"
    ],
    "Disclosure & Inference":[
      "Sensitive Data Types","Inference Attacks","Prevention Techniques"
    ],
    "Database Attacks":[
      "SQL Injection","Privilege Abuse","Cloud Config Errors"
    ]
  },

  "Module 6 – Web & Browser Security": {
    "Browser Attacks":[
      "Man‑in‑the‑Browser","Keyloggers","Page‑in‑the‑Middle",
      "Program Download Substitution","CAPTCHA Relay"
    ],
    "Content & Data Attacks":[
      "XSS","Directory Traversal","Server‑Side Includes","Drive‑By Download"
    ]
  },

  "Module 7 – Email & Phishing": {
    "Email‑Based Threats":[
      "Spam","Phishing","Spear Phishing","Cryptographic Protection"
    ]
  }
};

/* ── GRAPH GENERATION ───────────────────────────────────────── */
let nodeSet   = new vis.DataSet();
let edgeSet   = new vis.DataSet();
let nodeIndex = 0;
const colors  = ["#00bcd4","#ff9800","#8bc34a","#e91e63","#9c27b0","#ffc107",
                 "#03a9f4","#4caf50","#f44336","#607d8b"];   // 10 module hues

function addNode(label,group,level){
  if(nodeSet.get(label)) return;      // unique per label
  nodeSet.add({
     id:label,label,
     group,shape:"dot",
     size: Math.max(1,16-level*2),
     font:{color:"#ccc"}
  });
}

function traverse(obj,parentLabel,group,level){
  for(const key in obj){
    const val = obj[key];
    addNode(key,group,level);
    if(parentLabel) edgeSet.add({from:parentLabel,to:key,width:1.5});
    if(Array.isArray(val)){
      val.forEach(bullet=>{
        addNode(bullet,group,level+1);
        edgeSet.add({from:key,to:bullet,width:.75});
      });
    }else if(typeof val==="object"){
      traverse(val,key,group,level+1);
    }
  }
}

// build
Object.entries(syllabus).forEach(([module,i],idx)=>{
  const grpColor = colors[idx % colors.length];
  addNode(module,idx,0);
  nodeSet.update({id:module,color:grpColor});
  traverse(i,module,idx,1);
});

/* ── neighbor highlight & filtering (as in your original) ───── */
let network,allNodes,nodeColors={},highlightActive=false;

function neighbourhoodHighlight(params){
  allNodes   = nodeSet.get({returnType:"Object"});
  if(params.nodes.length){
    highlightActive=true;
    // dim all
    Object.values(allNodes).forEach(n=>{
       nodeColors[n.id]=n.color;
       n.color="rgba(150,150,150,0.2)";
       if(!n.hiddenLabel){ n.hiddenLabel=n.label; n.label=undefined; }
    });
    // restore 1‑ and 2‑hop neighbours
    const sel      = params.nodes[0];
    const firstHop = network.getConnectedNodes(sel);
    const secondHop=[...new Set(firstHop.flatMap(n=>network.getConnectedNodes(n)))];

    [sel,...firstHop,...secondHop].forEach(nid=>{
       const n = allNodes[nid];
       n.color=nodeColors[nid];
       if(n.hiddenLabel){ n.label=n.hiddenLabel; n.hiddenLabel=undefined; }
    });
    nodeSet.update(Object.values(allNodes));
  }else if(highlightActive){
    // reset
    Object.values(allNodes).forEach(n=>{
       n.color=nodeColors[n.id];
       if(n.hiddenLabel){ n.label=n.hiddenLabel; n.hiddenLabel=undefined; }
    });
    nodeSet.update(Object.values(allNodes));
    highlightActive=false;
  }
}

/* ── UI dropdown options ────────────────────────────────────── */
const selectEl=document.getElementById("select-node");
nodeSet.forEach(n=>{
  const opt=document.createElement("option");
  opt.value=n.id; opt.textContent=n.id;
  selectEl.appendChild(opt);
});
new TomSelect("#select-node",{create:false,sortField:{field:"text",direction:"asc"}});

/* ── Vis network  ───────────────────────────────────────────── */
const options={
 configure:{enabled:true,filter:["physics"]},
 interaction:{dragNodes:true},
 physics:{
   solver:"forceAtlas2Based",
   forceAtlas2Based:{gravitationalConstant:-40,springLength:100,centralGravity:0.02},
   stabilization:{iterations:600,fit:true}
 }
};
network=new vis.Network(document.getElementById("mynetwork"),
                        {nodes:nodeSet,edges:edgeSet},options);
network.on("selectNode",neighbourhoodHighlight);

/* progress bar ­– show until stabilization */
network.on("stabilizationProgress",p=>{
  const pct=Math.floor(100*p.iterations/p.total);
  document.getElementById("bar").style.width = pct*5+"px";
  document.getElementById("progressText").textContent=pct+" %";
});
network.once("stabilizationIterationsDone",()=>{
  document.getElementById("bar").style.width="500px";
  document.getElementById("progressText").textContent="100 %";
  setTimeout(()=>document.getElementById("loadingBar").classList.add("hidden"),500);
});

/* helper for dropdown‑based selection */
selectEl.addEventListener("change",e=>{
  const id=e.target.value;
  if(nodeSet.get(id)){ network.selectNodes([id]); neighbourhoodHighlight({nodes:[id]}); }
});
</script>
</body>
</html>
